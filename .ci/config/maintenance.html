    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #ee7752, #f13c3c, #6364ba, #23d5ab);

      animation: gradient 15s ease infinite;
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .product-logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
    }

    .product-logo {
      width: 280px;
      height: auto;
    }

    .company-logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: auto;
      background-color: transparent;
      flex-direction: column;
    }

    .company-logo {
      width: 105px; /* reduced by 30% */
      height: auto;
    }

    .info {
      color: #fbfbfb;
      text-align: center;
    }
    .go-to-admin-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
