worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The scheme the client used. A proxy terminating TLS in front of the image says it in
    # X-Forwarded-Proto; our own $scheme is always http (listen 8080), and passing it on would make
    # every request look insecure to the HTTPS-only mobile API (api/hooks/app-mobile-api).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 8080;
        server_name localhost;
        # the application limits its uploads itself (a picture - 5 MB); nginx's default 1 MB refused them first, with a 413
        client_max_body_size 10m;

        location /mcp {
            proxy_pass http://127.0.0.1:42880;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass_request_body on;
        }

        location / {
            error_page 502 504 =503 /maintenance.html;

            proxy_pass http://127.0.0.1:42880;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_pass_request_body on;
            proxy_redirect off;
            proxy_set_header X-NginX-Proxy true;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        location /red {
            error_page 502 504 =503 /maintenance.html;
            
            proxy_pass http://127.0.0.1:42881;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Maintenance stub. Served through error_page with an explicit =503 override,
        # so healthcheck/orchestration never sees a 200 while the app is still starting.
        location = /maintenance.html {
            internal;
            root /var/lib/html;
            add_header Retry-After 15 always;
            add_header Cache-Control "no-store" always;
            try_files /maintenance.html =503;
        }
    }
}
